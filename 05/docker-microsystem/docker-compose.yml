services:
  # ---------- 反向代理 + Web Server ----------
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api-node
      - api-python
      - api-rust
    networks:
      - app-net
    restart: unless-stopped

  # ---------- 資料庫 ----------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net
    restart: unless-stopped

  # ---------- Node.js 微服務 ----------
  api-node:
    build: ./backend-node
    environment:
      PORT: 3000
      DATABASE_URL: postgres://app:apppass@db:5432/appdb
      SERVICE_NAME: api-node
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  # ---------- Python 微服務 ----------
  api-python:
    build: ./backend-python
    environment:
      PORT: 5000
      DATABASE_URL: postgres://app:apppass@db:5432/appdb
      SERVICE_NAME: api-python
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  # ---------- Rust 微服務 ----------
  api-rust:
    build: ./backend-rust
    environment:
      PORT: 8000
      DATABASE_URL: postgres://app:apppass@db:5432/appdb
      SERVICE_NAME: api-rust
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:

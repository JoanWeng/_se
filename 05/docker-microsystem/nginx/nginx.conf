upstream node_upstream   { server api-node:3000; }
upstream python_upstream { server api-python:5000; }
upstream rust_upstream   { server api-rust:8000; }

server {
    listen 80;
    server_name localhost;

    # 靜態 web 介面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Node.js 微服務
    location /api/node/ {
        proxy_pass http://node_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Python 微服務
    location /api/python/ {
        proxy_pass http://python_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rust 微服務
    location /api/rust/ {
        proxy_pass http://rust_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # nginx 狀態頁 (展示用)
    location /nginx-status {
        stub_status;
        allow all;
    }
}
